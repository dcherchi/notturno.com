<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Notturno</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      overflow-x: hidden;
    }

    /* STELLE */
    .stars {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 40px;
      font-size: 20px;
      color: #fff;
      z-index: 2;
    }

    .stars.left { left: 10px; }
    .stars.right { right: 10px; }

    .rotate {
      display: inline-block;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* BANNER */
    .banner {
      position: fixed;
      top: 0;
      width: 100%;
      height: 110px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: #000;
      border-bottom: 1px solid #39ff1433;
      z-index: 3;
    }

    .track {
      display: flex;
      width: max-content;
      animation: scrollLoop 12s linear infinite;
    }

    @keyframes scrollLoop {
      100% { transform: translateX(-50%); }
    }

    .glitch {
      font-family: 'Press Start 2P', monospace;
      font-size: 28px;
      color: #39ff14;
      padding-right: 60px;
      -webkit-text-stroke: 1px #fff;
    }

    /* CONTENUTO */
    .content {
      margin-top: 140px;
      text-align: center;
      padding: 0 10px;
    }

    .title {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #fff;
      margin-bottom: 30px;
    }

    /* COVER */
    .cover {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .cover img {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    /* CTA */
    .cta {
      margin-top: 25px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #39ff14;
      color: #000;
      padding: 14px 20px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #1a1a1a;
      animation: flicker 2.5s infinite;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1a1a1a;
    }

    @keyframes flicker {
      0%,100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    /* OVERLAY */
    .overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 95vw;
      max-width: 800px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .overlay img {
      width: 100%;
      height: auto;
    }

    .overlay.active {
      opacity: 1;
    }

    /* MOBILE */
    @media (max-width: 480px) {
      .glitch { font-size: 22px; }
      .title { font-size: 14px; }
      .stars { gap: 25px; font-size: 16px; }
    }

  </style>
</head>

<body>

  <!-- stelle -->
  <div class="stars left">
    <div>★</div>
    <div class="rotate">★</div>
    <div>★</div>
  </div>

  <div class="stars right">
    <div>★</div>
    <div class="rotate">★</div>
    <div>★</div>
  </div>

  <!-- banner -->
  <div class="banner">
    <div class="track">
      <span class="glitch">NOTTURNO.COM</span>
      <span class="glitch">NOTTURNO.COM</span>
      <span class="glitch">NOTTURNO.COM</span>
      <span class="glitch">NOTTURNO.COM</span>
    </div>
  </div>

  <!-- contenuto -->
  <div class="content">
    <div class="title">FUORI IL 12/06/2026</div>

    <div class="cover">
      <img src="IMG_1397.jpg">
    </div>

    <div class="cta">
      <a href="https://music.apple.com/us/album/bevo-da-solo-single/1880711941" target="_blank" class="btn">
        PRE-SALVA
      </a>
    </div>
  </div>

  <!-- overlay -->
  <div class="overlay" id="overlay">
    <img src="overlay.png">
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    let visible = false;

    setInterval(() => {
      visible = !visible;
      overlay.classList.toggle('active', visible);
    }, 3000);
  </script>

</body>
</html>
